<h2>Masukkan Nilai</h2>

<p>Nilai Tugas:</p>

<input type="number" id="tugas">

<p>Nilai Ulangan Harian:</p>

<input type="number" id="ulangan">

<p>Nilai Ujian Akhir:</p>

<input type="number" id="ujian">

<br><br>

<button onclick="hitung()">Hitung</button>

<h3 id="nilai"></h3>

<h3 id="grade"></h3>

<h3 id="status"></h3>

<footer>

<p>NPD GROUP</p>

</footer>

<script>

function hitung() {

    let tugas = parseFloat(document.getElementById("tugas").value);

    let ulangan = parseFloat(document.getElementById("ulangan").value);

    let ujian = parseFloat(document.getElementById("ujian").value);

    let nilai = (0.3 * tugas) + (0.3 * ulangan) + (0.4 * ujian);

    let grade;

    if (nilai > 90) {

        grade = "A";

    } else if (nilai > 75) {

        grade = "B";

    } else if (nilai > 60) {

        grade = "C";

    } else if (nilai > 50) {

        grade = "D";

    } else {

        grade = "E";

    }

    let status = nilai > 75 ? "LULUS" : "REMEDIAL";

    document.getElementById("nilai").innerHTML =

        "Nilai Akhir: " + nilai.toFixed(2);

    document.getElementById("grade").innerHTML =

        "Grade: " + grade;

    document.getElementById("status").innerHTML =

        "Status: " + status;

}

</script>
